# ESO for GitLab lab, AWS Secrets Manager, ap-south-1, IRSA.
# Apply order: ClusterSecretStore first, then ExternalSecrets, in namespace gitlab.
# Secrets Manager secret names must start with gitlab-, to match the IRSA policy
# in Terraform: secretsmanager:GetSecretValue and DescribeSecret on
# arn:aws:secretsmanager:ap-south-1:*:secret:gitlab-*
# Store db, redis, and praefect secrets as plaintext strings in Secrets Manager.
# Store rails-storage as plaintext connection YAML, and rds-ca as plaintext CA bundle.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-db-password
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: gitlab-db-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: gitlab-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-redis-password
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: gitlab-redis-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: gitlab-redis-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: praefect-external-token
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: praefect-external-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: gitlab-praefect-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-rails-storage
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: gitlab-rails-storage
    creationPolicy: Owner
  data:
    - secretKey: connection
      remoteRef:
        key: gitlab-rails-storage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-rds-ca
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: aws-rds-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: gitlab-rds-ca
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-smtp
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: gitlab-smtp
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: gitlab-smtp
        property: username
    - secretKey: password
      remoteRef:
        key: gitlab-smtp
        property: password
